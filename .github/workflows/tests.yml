# Deterministic test + coverage CI (no AI). Independent verification for every PR,
# including commits pushed by the unit-test agent.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest + coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests with coverage
        run: >
          python -m pytest
          --cov=app --cov-report=term-missing --cov-report=json --cov-report=xml
          --junitxml=coverage/junit.xml
      - name: Coverage summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("coverage/coverage.json")
          if not p.exists():
              print("### Backend coverage\nNo coverage report produced.")
              raise SystemExit
          d = json.loads(p.read_text())
          t = d["totals"]
          print(f"### Backend coverage: {t['percent_covered_display']}%")
          print(f"Statements {t['covered_lines']}/{t['num_statements']}, branches {t.get('covered_branches', 0)}/{t.get('num_branches', 0)}\n")
          print("| File | Cover |\n|---|---|")
          for name, f in sorted(d["files"].items()):
              print(f"| `{name}` | {f['summary']['percent_covered_display']}% |")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

  frontend:
    name: frontend (typecheck + vitest + coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Run tests with coverage
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=coverage/junit.xml
      - name: Coverage summary
        if: always()
        run: |
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const p = "coverage/coverage-summary.json";
          if (!fs.existsSync(p)) { console.log("### Frontend coverage\nNo coverage report produced."); process.exit(0); }
          const d = JSON.parse(fs.readFileSync(p, "utf8"));
          const t = d.total;
          console.log(`### Frontend coverage: ${t.lines.pct}% lines`);
          console.log(`Statements ${t.statements.pct}%, branches ${t.branches.pct}%, functions ${t.functions.pct}%\n`);
          console.log("| File | Lines | Branches |\n|---|---|---|");
          for (const [f, s] of Object.entries(d)) {
            if (f === "total") continue;
            console.log(`| \`${f.replace(process.cwd() + "/", "")}\` | ${s.lines.pct}% | ${s.branches.pct}% |`);
          }
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14
